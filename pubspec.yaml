name: template
description: Flutter стартовый шаблон — Clean Architecture, BLoC, Drift, GoRouter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.7

  # Local database (Drift / SQLite)
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # HTTP client
  dio: ^5.7.0

  # Charts
  fl_chart: ^0.69.0

  # Session storage
  shared_preferences: ^2.3.3

  # Company logo (gallery) on registration
  image_picker: ^1.1.2

  # Firebase
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  # Нативный Google Sign-In (системный диалог), без открытия браузера как у signInWithProvider
  google_sign_in: ^6.2.2
  flutter_dotenv: ^5.1.0

  # Network reachability (vacancies offline banner)
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.12
  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/png/logo.png

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
  windows:
    generate: true
  image_path: assets/png/logo.png
  min_sdk_android: 21
  remove_alpha_ios: true

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F9F9FC"
  image: assets/png/logo.png
  android_12:
    color: "#F9F9FC"
    image: assets/png/logo.png
  ios: true
  android: true
  web: true
